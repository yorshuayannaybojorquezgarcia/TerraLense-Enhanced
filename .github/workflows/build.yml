
name: Build TerraLense

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Permisos de Gradle
        run: chmod +x ./gradlew

      - name: Compilar TerraLense
        run: gradle clean build --stacktrace

      - name: Subir JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TerraLense-development-build
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Subir reportes de errores
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TerraLense-build-diagnostics
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
