# Paper API artifact used for compilation only.
paperApiVersion=26.2.build.112-stable

# API level advertised in plugin.yml.
apiVersion=1.21

# SQLite driver. Paper downloads this at runtime via plugin.yml's libraries block.
sqliteVersion=3.50.1.0

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
